<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="[내이름]의 포트폴리오 웹페이지입니다.">
    <title>[내이름] | Portfolio</title>
    
    <!-- Pretendard 폰트 불러오기 -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />

    <style>
        :root {
            --navy: #172b4d;
            --blue: #426da3;
            --light: #f3f7fb;
            --line: #e2e8f0;
            --muted: #586a80;
        }

        * { box-sizing: border-box; }

        html { 
            scroll-behavior: smooth; 
            scroll-padding-top: 88px; 
        }

        body { 
            margin: 0; 
            color: #243248; 
            font-family: Pretendard, 'Noto Sans KR', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif; 
        }

        a { 
            color: inherit; 
            text-decoration: none; 
        }

        .wrap { 
            max-width: 1050px; 
            margin: 0 auto; 
            padding: 0 26px; 
        }

        /* 상단 헤더 */
        header { 
            position: sticky; 
            top: 0; 
            z-index: 10; 
            background: rgba(255, 255, 255, 0.95); 
            backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--line);
        }

        .nav { 
            min-height: 70px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
        }

        .logo { 
            font-size: 19px; 
            font-weight: 800; 
            color: var(--navy); 
            letter-spacing: -0.5px; 
        }

        .menu { 
            display: flex; 
            gap: 22px; 
            flex-wrap: wrap; 
        }

        .menu a { 
            color: var(--muted); 
            font-size: 13px; 
            font-weight: 600; 
            transition: color 0.2s;
        }

        .menu a:hover, 
        .menu a:focus-visible { 
            color: var(--blue); 
        }

        /* 메인 히어로 섹션 */
        .hero { 
            background: linear-gradient(120deg, #f0f5fb 0%, #ffffff 78%); 
            padding: 100px 0 80px; 
        }

        .eyebrow { 
            color: var(--blue); 
            font-weight: 700; 
            font-size: 13px; 
            letter-spacing: 1px; 
            text-transform: uppercase;
        }

        h1 { 
            color: var(--navy); 
            font-size: clamp(38px, 6vw, 62px); 
            line-height: 1.2; 
            letter-spacing: -1px;
            margin: 12px 0 20px;
        }

        .hero p { 
            max-width: 650px; 
            color: var(--muted); 
            font-size: 17px; 
            line-height: 1.6;
            margin: 0;
        }

        .actions { 
            display: flex; 
            gap: 12px; 
            flex-wrap: wrap; 
            margin-top: 32px; 
        }

        /* 버튼 스타일 */
        .btn { 
            display: inline-block; 
            border-radius: 8px; 
            padding: 11px 20px; 
            font-size: 14px; 
            font-weight: 600; 
            transition: all 0.2s;
        }

        .btn.primary { 
            background: var(--navy); 
            color: #ffffff; 
        }

        .btn.primary:hover {
            background: #0f1d35;
        }

        .btn.secondary { 
            background: #ffffff; 
            color: var(--navy); 
            border: 1px solid var(--line);
        }

        .btn.secondary:hover {
            background: var(--light);
        }

        /* 컨텐츠 섹션 */
        section { 
            padding: 80px 0; 
        }

        .section-title { 
            margin: 0 0 8px; 
            font-size: 29px; 
            letter-spacing: -0.8px; 
            color: var(--navy);
        }

        .section-sub { 
            color: var(--muted); 
            margin: 0 0 32px; 
            font-size: 14px; 
        }

        .intro { 
            max-width: 800px; 
            font-size: 16px; 
            line-height: 1.7; 
        }

        /* 사진 카드 그리드 */
        .photo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 24px;
            margin-top: 32px;
        }

        .photo-card {
            border: 1px solid var(--line);
            border-radius: 12px;
            overflow: hidden;
            background: #fff;
            transition: box-shadow 0.2s;
        }

        .photo-card:hover {
            box-shadow: 0 4px 20px rgba(23,43,77,0.10);
        }

        .photo-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            display: block;
            background: var(--light);
        }

        .photo-card-body {
            padding: 16px 20px 20px;
        }

        .photo-card-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--navy);
            margin: 0 0 12px;
        }

        .cheer-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .cheer-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--light);
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: 600;
            color: var(--navy);
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
        }

        .cheer-btn:hover:not(:disabled) {
            background: #e2eaf5;
            border-color: var(--blue);
        }

        .cheer-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .cheer-count {
            font-size: 14px;
            color: var(--muted);
            font-weight: 600;
            min-width: 32px;
        }

        .cheer-msg {
            font-size: 12px;
            margin-top: 8px;
            min-height: 18px;
            color: var(--blue);
        }

        .cheer-msg.error {
            color: #c0392b;
        }
    </style>
</head>
<body>

    <!-- 헤더 영역 -->
    <header>
        <div class="wrap nav">
            <!-- 1. 영문 이름 변경 -->
            <a href="#" class="logo">[HONG GIL DONG]</a>
            <nav class="menu">
                <a href="#about">소개</a>
                <a href="#projects">프로젝트</a>
                <a href="#skills">역량</a>
                <a href="#contact">연락처</a>
            </nav>
        </div>
    </header>

    <!-- 히어로(메인) 영역 -->
    <div class="hero">
        <div class="wrap">
            <!-- 2. 전공/분야 변경 -->
            <div class="eyebrow">[경영정학과 / 데이터 분석]</div>
            <!-- 3. 메인 타이틀 변경 -->
            <h1>[변화를 만들어가는]<br>[서윤석]입니다.</h1>
            <!-- 4. 한 줄 소개 변경 -->
            <p>[소속 학교 및 학과, 목표나 관심 분야에 대한 간단한 설명을 입력하세요.]</p>
            <div class="actions">
                <a href="#projects" class="btn primary">프로젝트 보기</a>
                <a href="#contact" class="btn secondary">연락하기</a>
            </div>
        </div>
    </div>

    <!-- 소개 섹션 -->
    <section id="about">
        <div class="wrap">
            <h2 class="section-title">About Me</h2>
            <p class="section-sub">[나를 표현하는 한 줄 서술]</p>
            <div class="intro">
                [안녕하세요! 본인의 관심사, 기술 스택, 추구하는 목표 등을 작성하는 본문 영역입니다.]
            </div>
        </div>
    </section>

    <!-- 사진 응원 섹션 -->
    <section id="projects">
        <div class="wrap">
            <h2 class="section-title">Photos</h2>
            <p class="section-sub">마음에 드는 사진에 응원을 남겨 주세요.</p>

            <div class="photo-grid">

                <!-- 사진 1 -->
                <div class="photo-card">
                    <img src="https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=600&q=80" alt="산 풍경" id="img-photo-01">
                    <div class="photo-card-body">
                        <p class="photo-card-title">산 풍경</p>
                        <div class="cheer-row">
                            <button class="cheer-btn" data-photo-id="photo-01" aria-label="사진 1 응원하기">
                                🤍 응원하기
                            </button>
                            <span class="cheer-count" id="count-photo-01">—</span>회
                        </div>
                        <p class="cheer-msg" id="msg-photo-01"></p>
                    </div>
                </div>

                <!-- 사진 2 -->
                <div class="photo-card">
                    <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=600&q=80" alt="해변 풍경" id="img-photo-02">
                    <div class="photo-card-body">
                        <p class="photo-card-title">해변 풍경</p>
                        <div class="cheer-row">
                            <button class="cheer-btn" data-photo-id="photo-02" aria-label="사진 2 응원하기">
                                🤍 응원하기
                            </button>
                            <span class="cheer-count" id="count-photo-02">—</span>회
                        </div>
                        <p class="cheer-msg" id="msg-photo-02"></p>
                    </div>
                </div>

                <!-- 사진 3 -->
                <div class="photo-card">
                    <img src="https://images.unsplash.com/photo-1519331379826-f10be5486c6f?w=600&q=80" alt="도시 야경" id="img-photo-03">
                    <div class="photo-card-body">
                        <p class="photo-card-title">도시 야경</p>
                        <div class="cheer-row">
                            <button class="cheer-btn" data-photo-id="photo-03" aria-label="사진 3 응원하기">
                                🤍 응원하기
                            </button>
                            <span class="cheer-count" id="count-photo-03">—</span>회
                        </div>
                        <p class="cheer-msg" id="msg-photo-03"></p>
                    </div>
                </div>

            </div>
        </div>
    </section>

    <script>
        const API = '/api/react';
        // 허용된 photo_id 목록 — 서버와 동일하게 유지
        const ALLOWED = ['photo-01', 'photo-02', 'photo-03'];

        // ── 페이지 로드 시 응원 횟수 조회 ───────────────────────
        async function loadCounts() {
            try {
                const res = await fetch(API);
                if (!res.ok) throw new Error('조회 실패 (HTTP ' + res.status + ')');
                const data = await res.json();
                if (!data.counts) throw new Error('응답 형식 오류');

                for (const id of ALLOWED) {
                    const el = document.getElementById('count-' + id);
                    // textContent만 사용 — innerHTML 사용 금지
                    if (el) el.textContent = data.counts[id] ?? 0;
                }
            } catch (err) {
                console.error('횟수 조회 실패:', err.message);
                for (const id of ALLOWED) {
                    const el = document.getElementById('count-' + id);
                    if (el) el.textContent = '?';
                }
            }
        }

        // ── 응원 버튼 클릭 처리 ─────────────────────────────────
        async function handleCheer(photoId) {
            // 클라이언트 1차 검사: 허용 목록 확인
            if (!ALLOWED.includes(photoId)) {
                console.warn('허용되지 않은 photo_id:', photoId);
                return;
            }

            // photo_id를 DOM 탐색에 사용할 때 CSS selector injection 방지:
            // data-photo-id 속성으로만 버튼을 찾고 id는 고정 prefix 사용
            const btn = document.querySelector(
                '[data-photo-id="' + photoId.replace(/"/g, '') + '"]'
            );
            const countEl = document.getElementById('count-' + photoId);
            const msgEl   = document.getElementById('msg-'   + photoId);
            if (!btn || !countEl || !msgEl) return;

            // ── 저장 중 상태 ─────────────────────────────────────
            btn.disabled = true;
            msgEl.textContent = '저장 중…';  // textContent — HTML 실행 안 함
            msgEl.className = 'cheer-msg';

            try {
                const res = await fetch(API, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ photo_id: photoId }),
                });

                // ── 서버 응답 확인 후에만 성공 처리 ─────────────
                if (!res.ok) {
                    // 서버가 반환한 오류 메시지 파싱 시도
                    let errMsg = '저장에 실패했습니다. 다시 시도해 주세요.';
                    try {
                        const errData = await res.json();
                        if (errData.error) errMsg = errData.error;
                    } catch { /* json 파싱 실패 시 기본 메시지 사용 */ }
                    throw new Error(errMsg);
                }

                // ── 성공: 횟수 서버에서 재조회하여 정확한 값 표시 ──
                await loadCounts();
                msgEl.textContent = '응원이 저장되었습니다 ✓';
                msgEl.className = 'cheer-msg';
                setTimeout(() => { msgEl.textContent = ''; }, 2000);

            } catch (err) {
                // 실패는 절대 성공으로 표시하지 않음
                msgEl.textContent = err.message || '저장에 실패했습니다. 다시 시도해 주세요.';
                msgEl.className = 'cheer-msg error';
            } finally {
                btn.disabled = false;
            }
        }

        // ── 버튼 이벤트 등록 ────────────────────────────────────
        document.querySelectorAll('.cheer-btn').forEach(function(btn) {
            btn.addEventListener('click', function() {
                handleCheer(btn.dataset.photoId);
            });
        });

        // ── 초기 횟수 로드 ───────────────────────────────────────
        loadCounts();
    </script>

</body>
</html>
